name: Deploy static site

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy:
    runs-on: [self-hosted, licznik]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set target path
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "target=/deploy/www/" >> $GITHUB_OUTPUT
          else
            echo "target=/deploy/www/dev/" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via rsync
        run: |
          rsync -avzr --delete \
            --exclude=.github/ \
            --exclude=README.md \
            --exclude=CLAUDE.md \
            --exclude=.git/ \
            --exclude=.gitignore \
            --exclude=dev/ \
            ./ ${{ steps.vars.outputs.target }}
