name: Deploy static site

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set target path
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "target=/var/www/html/licznik-czasu/" >> $GITHUB_OUTPUT
          else
            echo "target=/var/www/html/licznik-czasu/dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude=.github/
            --exclude=README.md
            --exclude=CLAUDE.md
            --exclude=.git/
            --exclude=.gitignore
            --exclude=dev/
          path: ./
          remote_path: ${{ steps.vars.outputs.target }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}
